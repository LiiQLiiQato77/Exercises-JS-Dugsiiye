<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 40</title>
    <link rel="stylesheet" href="exercise40.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="music-player">
        <div class="song-info">
            <video id="cover" poster="https://placehold.co/200/f08922/fff" playsinline></video>
            <h2 id="title">Song Title</h2>
            <p id="artist">Artist Name</p>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress"></div>
            </div>

            <div class="time">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <!-- controls -->
         <div class="controls">
            <button id="prev" class="control-btn"><i class="fa fa-step-backward"></i></button>

            <button id="play" class="control-btn play-btn"><i class="fa fa-play"></i></button>

            <button id="next" class="control-btn"><i class="fa fa-step-forward"></i></button>
         </div>

         <!-- Addional Controls -->
          <div class="speed-control">
          <div class="volume-container">
            <i class="fa fa-volume-down"></i>
            <input type="range" name="volume" id="volume" min="0" max="1" step="0.1" value="1">
          </div>

          <div class="speed-container">
            <i class="fas fa-tachometer-alt"></i>

            <select name="speed" id="speed">
                <option value="0.5">0.5x</option>
                <option value="0.75">0.75x</option>
                <option value="1" selected>1x</option>
                <option value="1.25">1.25x</option>
                <option value="2">2x</option>
            </select>
          </div>

          </div>

    </div>

    <script src="exercise40.js"></script>
</body>
</html>
